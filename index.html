    content: "";

    left: -2px;
    width: 240px;
    height: 18px;
    border: 2px solid #00ffff;

    left: 0;
    width: 100%;
    color: #00ffff;

    text-shadow: 0 0 8px #00ffff;

/* Candles */

    top: -23px;
    left: -2px;

@keyframes flicker {

let currentScene = 0;

function initializeProtocol() {

    document.querySelector(".initialize-button").style.display =
        "none";

    document.querySelector("#continue-button").style.display =
        "none";

    document.querySelector("#status-message").style.display =
        "none";

    showNextScene();
}
function continueProtocol() {

    document.querySelector("#continue-button").style.display =
        "none";

    const scene = scenes[currentScene - 1];

    if (scene.buttonText === "[ NOW MAKE A WISH ]") {
        showBirthdayCake();
        return;
    }

    if (scene.buttonText === "END TRANSMISSION.") {
        shutdownSystem();
        return;
    }

    showNextScene();

}
    function shutdownSystem() {

    document.body.classList.add("shutdown");

    setTimeout(function() {

        document.querySelector(".screen").style.display = "none";

    }, 2000);

}

function showNextScene() {

    if (currentScene < scenes.length) {

        const messageArea = document.querySelector("#message-area");

        messageArea.innerHTML = "";

        const scene = scenes[currentScene];

        currentScene++;

        showNextLine(scene.lines, 0);

    }

}

function showNextLine(lines, lineIndex) {

  if (lineIndex >= lines.length) {

    const scene = scenes[currentScene - 1];

    if (scene.autoAdvance) {

        setTimeout(function() {
            showNextScene();
        }, 2000);

    } else {

        document.querySelector("#continue-button").textContent =
            scene.buttonText || "[ CONTINUE ]";

        document.querySelector("#continue-button").style.display =
            "inline-block";

    }

    return;
}

    const line = lines[lineIndex];

    const messageArea = document.querySelector("#message-area");

    const heading = document.createElement("h1");

    heading.className = line.type;

    messageArea.appendChild(heading);

    if (line.typing) {

        let character = 0;

        const typing = setInterval(function() {

            heading.textContent += line.text[character];

            character++;

            if (character === line.text.length) {

                clearInterval(typing);

                setTimeout(function() {

                    showNextLine(lines, lineIndex + 1);

                }, line.delay);

            }

        }, 50);

    } else {

        heading.textContent = line.text;

               setTimeout(function() {

            showNextLine(lines, lineIndex + 1);

        }, line.delay);

    }

} // Closes showNextLine()

function blowCandles() {
    const flames = document.querySelectorAll(".flame");

    flames.forEach(function(flame) {
        flame.classList.add("blown");
    });

    const button = document.querySelector("#blow-button");
    button.style.display = "none";

    setTimeout(function() {
        const cakeContainer = document.querySelector(".cake-container");

        cakeContainer.innerHTML = `
            <div class="heart-screen">
                <div class="heart">♡</div>

                <button
                    class="initialize-button"
                    id="end-transmission-button">
                    [ END TRANSMISSION. ]
                </button>
            </div>
        `;

        document
            .querySelector("#end-transmission-button")
            .addEventListener("click", shutdownSystem);

    }, 900);
}
</script>
