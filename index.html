<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Birthday Protocol</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #050505;
            color: #00ff88;
            font-family: "Courier New", monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .screen {
            width: 90%;
            max-width: 900px;
            min-height: 500px;
            border: 1px solid #00ff88;
            padding: 50px;
            box-shadow:
                0 0 10px #00ff88,
                0 0 30px rgba(0, 255, 136, 0.15);
            position: relative;
        }

        .screen::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0px,
                transparent 3px,
                rgba(0, 255, 136, 0.025) 4px
            );
        }

        .terminal-text {
            position: relative;
            z-index: 1;
        }

        .small-text {
            font-size: 14px;
            opacity: 0.7;
            margin-bottom: 30px;
        }

     h1 {
    font-size: clamp(22px, 4vw, 38px);
    font-weight: normal;
    text-shadow: 0 0 10px #00ff88;
    margin-bottom: 20px;
    min-height: 60px;
}
h1.finding {
    font-size: clamp(22px, 4vw, 38px);
    font-style: italic;
    opacity: 0.9;
    color: #00d9ff;
    text-shadow: 0 0 8px rgba(0, 217, 255, 0.5);
}
        h1.system {
    font-size: clamp(22px, 4vw, 38px);
    font-style: normal;
    opacity: 1;
    text-shadow: 0 0 10px #00ff88;
}

       p {
    font-size: 18px;
    line-height: 1.7;
    opacity: 0.8;
}

        .cursor {
            display: inline-block;
            width: 10px;
            height: 20px;
            background: #00ff88;
            animation: blink 1s infinite;
            vertical-align: middle;
        }

        .initialize-button {
            margin-top: 40px;
            padding: 14px 28px;
            background: transparent;
            border: 1px solid #00ff88;
            color: #00ff88;
            font-family: inherit;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .initialize-button:hover {
            background: #00ff88;
            color: #050505;
            box-shadow: 0 0 20px #00ff88;
        }

        @keyframes blink {
            0%, 49% {
                opacity: 1;
            }

            50%, 100% {
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <main class="screen">
        <div class="terminal-text">

            <div class="small-text">
                BIRTHDAY PROTOCOL // SYSTEM 30.0
            </div>

           <div id="message-area">

    <h1>Hello Kathesh.<br>This is a birthday message for you.</h1>

    <p id="status-message">
        Click to initialize.<span class="cursor"></span>
    </p>

</div>

            <button class="initialize-button" onclick="initializeProtocol()">
    [ INITIALIZE ]
</button>

        </div>
    </main>

<script>

const scenes = [

    {
        lines: [
            {
                text: "Scanning recipient…",
                type: "system",
                typing: true
            },
            {
                text: "Highly adorable being detected.",
                type: "finding",
                typing: true
            }
        ]
    },

    {
        lines: [
            {
                text: "Birthday protocol activated.",
                type: "system",
                typing: true
            },
            {
                text: "You have been upgraded to Version 30.0.",
                type: "system",
                typing: true
            },
            {
                text: "Warning: warranty has expired.",
                type: "system",
                typing: true
            }
        ]
    },

    {
        lines: [
            {
                text: "Do not panic.",
                type: "system",
                typing: true
            },
            {
                text: "Most of your existing features remain functional.",
                type: "system",
                typing: true
            }
        ]
    },

    {
        lines: [
            {
                text: "Running personality diagnostics…",
                type: "system",
                typing: true
            },
            {
                text: "Industrial designer detected.",
                type: "finding",
                typing: false
            },
            {
                text: "Scanning design philosophy…",
                type: "system",
                typing: false
            },
            {
                text: "Conventional solutions: rejected.",
                type: "finding",
                typing: false
            },
            {
                text: "Normal objects: insufficient.",
                type: "finding",
                typing: false
            },
            {
                text: "Unnecessarily complicated ideas: enthusiastically accepted.",
                type: "finding",
                typing: false
            },
            {
                text: "User appears to enjoy building things that make everyone else ask…",
                type: "finding",
                typing: false
            },
            {
                text: "But… why?",
                type: "finding",
                typing: true
            },
            {
                text: "User’s default response: “Because I can.”",
                type: "finding",
                typing: false
            }
        ]
    }

];

let currentScene = 0;

function initializeProtocol() {

    document.querySelector(".initialize-button").style.display =
        "none";

    document.querySelector("#status-message").style.display =
        "none";

    showNextScene();
}

function showNextScene() {

    if (currentScene < scenes.length) {

        const messageArea = document.querySelector("#message-area");

        messageArea.innerHTML = "";

        const scene = scenes[currentScene];

        currentScene++;

        showNextLine(scene.lines, 0);

    }

}

function showNextLine(lines, lineIndex) {

    if (lineIndex >= lines.length) {

        setTimeout(showNextScene, 2500);

        return;

    }

    const line = lines[lineIndex];

    const heading = document.createElement("h1");

    heading.className = line.type;

    messageArea.appendChild(heading);

    if (line.typing) {

        let character = 0;

        const typing = setInterval(function() {

            heading.textContent += line.text[character];

            character++;

            if (character === line.text.length) {

                clearInterval(typing);

                setTimeout(function() {
                    showNextLine(lines, lineIndex + 1);
                }, 800);

            }

        }, 50);

    } else {

        heading.textContent = line.text;

        setTimeout(function() {
            showNextLine(lines, lineIndex + 1);
        }, 500);

    }

}

</script>

</body>
</html>
